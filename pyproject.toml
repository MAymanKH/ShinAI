[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shinai-bot"
version = "0.1.0"
description = "A personality-driven multi-platform group chat bot"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    # Bot frameworks
    "discord.py>=2.7.1,<3",
    "pyrofork>=2.3.69,<3",
    "tgcrypto-pyrofork>=1.2.8,<2",
    "neonize>=0.4.3.post0,<0.5",
    "protobuf>=6.33.6,<7",

    # Vector store and embeddings
    "chromadb==1.5.5",
    # Keep the OpenTelemetry family aligned; mixed versions break Chroma imports.
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-proto==1.40.0",
    "opentelemetry-exporter-otlp-proto-common==1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.40.0",
    # The +cpu local version needs PyTorch's wheel index; see requirements.txt.
    "torch==2.12.1+cpu",
    "sentence-transformers>=5.7,<6",
    "numpy>=1.26,<3",

    # AI providers
    "google-genai>=2.17,<3",
    "openai>=2.54,<3",

    # Utilities
    "PyYAML>=6.0.3,<7",
    "python-dateutil>=2.9,<3",
    "ddgs>=9.14,<10",
    "beautifulsoup4>=4.15,<5",
    "httpx>=0.28.1,<1",
    "concurrent-log-handler>=0.9.29,<1",
    "faster-whisper>=1.2.1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.120,<7",
]
dev = [
    "shinai-bot[test]",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["shin_ai*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: uses temporary persistence or multiple components",
    "memory: measures process memory and may be slower",
]

[tool.coverage.run]
branch = true
source = ["shin_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",
    # Arabic examples and deliberate typographic punctuation are user-facing content.
    "RUF001",
    "RUF002",
]
